<section class="rounded-lg border border-emerald-700 bg-emerald-950/30 p-4 text-sm leading-relaxed text-slate-200" data-lesson>
  <h2 class="mb-2 font-semibold text-emerald-200">{{ _("📘 Lesson") }}</h2>
  {{ loc(ch, "lesson") | md }}
  <p class="mt-3 border-t border-emerald-900 pt-2 text-xs text-emerald-200/80" data-lesson-owasp>{{ _("📚 OWASP Top 10 for LLM 2025:") }}
    {% for code, name in ch.owasp_labels %}<strong>{{ code }}</strong> {{ name }}{% if not loop.last %} · {% endif %}{% endfor %}</p>
</section>
