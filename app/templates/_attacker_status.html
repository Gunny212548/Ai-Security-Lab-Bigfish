{% if error %}<p class="rounded-md border border-rose-700 bg-rose-950/50 px-3 py-2 text-sm text-rose-200" role="alert" data-error>{{ error }}</p>{% endif %}
{% if notice %}<p class="rounded-md border border-emerald-700 bg-emerald-950/40 px-3 py-2 text-sm text-emerald-200" data-notice>{{ notice }}</p>{% endif %}
