services:
  app:
    build: .
    env_file:
      - path: .env        # cp .env.example .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/bigfishdesk.db
      TZ: ICT-7           # log times in Thai time (POSIX form: works without tzdata in the slim image)
    ports:
      - "127.0.0.1:8001:8000"   # host-only (8001: Caddy owns 8000); the public way in is Caddy (HTTPS)
    logging:              # what players do: `docker compose logs -f app`; full history: data/activity.log
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./challenges:/app/challenges:ro
      - ./config:/app/config:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.10         # HTTPS with Caddy's own certificate (tls internal)
    depends_on:
      - app
    environment:              # read from .env; only this reaches the Caddy container
      PUBLIC_PORT: ${PUBLIC_PORT:-8000}
    ports:                    # router: forward the same external port to this server
      - "${PUBLIC_PORT:-8000}:${PUBLIC_PORT:-8000}"
      - "${PUBLIC_PORT:-8000}:${PUBLIC_PORT:-8000}/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates: keep across restarts
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
