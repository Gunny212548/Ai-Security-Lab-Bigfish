services:
  app:
    build: .
    env_file:
      - path: .env        # cp .env.example .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/bigfishdesk.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./challenges:/app/challenges:ro
      - ./config:/app/config:ro
    depends_on:
      ollama:
        condition: service_started
        required: false   # only present with `--profile local`
    restart: unless-stopped

  # Local model. Start with: docker compose --profile local up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "4"
    restart: unless-stopped
    # Uncomment for an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
